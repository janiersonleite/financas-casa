name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject version timestamp (horário de Brasília)
        run: |
          TIMESTAMP=$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M')
          CACHE_VER=$(TZ='America/Sao_Paulo' date '+%Y%m%d%H%M')
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$TIMESTAMP'/" js/app.js
          sed -i "s/app-runtime-v[^']*/app-runtime-v$CACHE_VER/g" sw.js
          echo "Versão injetada: $TIMESTAMP | Cache: app-runtime-v$CACHE_VER"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
