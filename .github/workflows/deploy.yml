name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # O deploy só acontece se os testes passarem (mesmo workflow usado em push/PR: .github/workflows/test.yml)
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject version timestamp (horário de Brasília)
        run: |
          TIMESTAMP=$(TZ='America/Sao_Paulo' date '+%Y-%m-%d %H:%M')
          CACHE_VER=$(TZ='America/Sao_Paulo' date '+%Y%m%d%H%M')
          sed -i "s/const APP_VERSION = '[^']*'/const APP_VERSION = '$TIMESTAMP'/" js/app.js
          sed -i "s/app-runtime-v[^']*/app-runtime-v$CACHE_VER/g" sw.js
          echo "Versão injetada: $TIMESTAMP | Cache: app-runtime-v$CACHE_VER"

      # Publica SÓ os arquivos do app (não envia tests/, docs/, supabase/, scripts/ nem arquivos de desenvolvimento).
      # Se o app passar a usar outro arquivo/pasta, inclua aqui (o teste tests/static/deploy-allowlist.test.js confere).
      - name: Montar o site (somente arquivos do app)
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js icon.svg icons js _site/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
