name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # O deploy só acontece se os testes passarem (mesmo workflow usado em push/PR: .github/workflows/test.yml)
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências e gerar o CSS (Tailwind)
        run: |
          npm ci
          npm run build:css

      # Monta _site/ só com os arquivos que o app referencia e injeta a versão (APP_VERSION e nome do cache do sw.js)
      # nas CÓPIAS, horário de Brasília. Falha se algum arquivo referenciado não existir. Ver scripts/build-site.js.
      - name: Montar o site (somente arquivos do app + versão)
        run: node scripts/build-site.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
